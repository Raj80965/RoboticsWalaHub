name: 💡 Feature Request
description: Suggest a new feature or enhancement for Robotics Wala Hub
title: "[Feature]: "
labels: ["enhancement", "feature-request"]
assignees: ["Raj80965"]

body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Feature Request
        Thank you for your idea! Help us understand your suggestion by filling out the sections below.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area does this feature belong to?
      options:
        - Student Experience
        - Admin Tools
        - Authentication & Security
        - QR Attendance System
        - Lab Booking System
        - Project Management
        - Hardware Inventory
        - Budget & Expenses
        - Analytics & Reports
        - UI/UX Design
        - Performance & Optimization
        - Web Simulator
        - IoT Integration
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature to you?
      options:
        - 🔴 Critical — Blocking my workflow
        - 🟠 High — Very important for productivity
        - 🟡 Medium — Nice to have
        - 🟢 Low — Minor improvement
      default: 2
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem this feature would solve. What pain point are you experiencing?
      placeholder: "I'm always frustrated when I have to manually check each student's attendance because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you'd like the feature to work.
      placeholder: "Add a button that automatically generates attendance reports for a selected date range..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: "Currently I export data manually to Excel, but this is time-consuming..."

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: If you have any visual mockups, wireframes, or references to similar features in other apps, share them here.
      placeholder: "Drag and drop images here or paste URLs..."

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context or information about the feature request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing feature requests to avoid duplicates
          required: true
        - label: I am willing to contribute to implementing this feature
          required: false
