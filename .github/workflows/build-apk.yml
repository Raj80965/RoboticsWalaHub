name: Build and Update RW HUB APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Update Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and Platform 35
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download and Setup Gradle 8.12
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle-8.12-bin.zip
          echo "$PWD/gradle-8.12/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Copy Built APK to Root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RW_HUB.apk
          cp app/build/outputs/apk/debug/app-debug.apk RoboticsWalaHub.apk

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RW_HUB_APK_AND_LOGS
          path: |
            app/build/outputs/apk/debug/*.apk
            build_log.txt
          retention-days: 30

      - name: Commit and Push Updated APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add RW_HUB.apk RoboticsWalaHub.apk
          if git diff --staged --quiet; then
            echo "No changes in APK"
          else
            git commit -m "auto: update RW_HUB.apk and RoboticsWalaHub.apk binaries [skip ci]"
            git push
          fi

