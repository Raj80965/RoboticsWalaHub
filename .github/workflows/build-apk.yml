name: Build and Update RW HUB APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Update Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download and Setup Gradle 8.12
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle-8.12-bin.zip
          echo "$PWD/gradle-8.12/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Copy Built APK to Root
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/*.apk RW_HUB.apk
          cp app/build/outputs/apk/debug/*.apk RoboticsWalaHub.apk
          ls -lh RW_HUB.apk RoboticsWalaHub.apk

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RW_HUB_APK_DEBUG
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Commit and Push Updated APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f RW_HUB.apk RoboticsWalaHub.apk
          git commit -m "auto: update compiled RW_HUB.apk and RoboticsWalaHub.apk binaries v2.0.0 [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
