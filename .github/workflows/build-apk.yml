name: Build RW HUB APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and Platform 35
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download and Setup Gradle 8.12
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle-8.12-bin.zip
          echo "$PWD/gradle-8.12/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RW_HUB_APK_AND_LOGS
          path: |
            app/build/outputs/apk/debug/*.apk
            build_log.txt
          retention-days: 30
