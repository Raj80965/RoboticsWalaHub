name: Build and Update RW HUB APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Update Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Built APK to Root
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RW_HUB.apk
          cp app/build/outputs/apk/debug/app-debug.apk RoboticsWalaHub.apk
          ls -lh RW_HUB.apk RoboticsWalaHub.apk

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RW_HUB_APK_DEBUG
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Commit and Push Updated APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f RW_HUB.apk RoboticsWalaHub.apk
          git commit -m "auto: update compiled RW_HUB.apk and RoboticsWalaHub.apk binaries v2.0.0 [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
